apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shsingh-tap-stage
  namespace: tssc-gitops
  finalizers: ["resources-finalizer.argocd.argoproj.io"] 
spec:
  project: default
  source:
    path: ./components/shsingh-tap/overlays/stage
    repoURL: https://github.com/shailendra-rhds/tap-gitops.git
    targetRevision: main
  destination:
    namespace: shsingh-tap-stage
    server: https://kubernetes.default.svc
  syncPolicy:
    managedNamespaceMetadata:
      labels: 
        argocd.argoproj.io/managed-by: tssc-gitops
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

